name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to a stable release rather than "latest" — this suite
          # was built against, and specifically hardened for, a Windows +
          # very-new-CPython subprocess/pytest-capture interaction (see
          # pytest.ini); pinning avoids chasing a moving target on that
          # front for a tool this small.
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Syntax / compile check
        run: |
          python -m py_compile scripts/quota_gate.py scripts/usage.py scripts/stream_render.py scripts/i18n.py
          bash -n bin/cc-run
          bash -n install.sh
          bash -n tests/test_cc_run.sh
          python tests/check_bash32_compat.py bin/cc-run install.sh tests/test_cc_run.sh shell/cc-run.sh
          python -c "import json; json.load(open('.claude-plugin/plugin.json')); json.load(open('.claude-plugin/marketplace.json'))"
          python -c "import json,glob; [json.load(open(f, encoding='utf-8')) for f in glob.glob('locales/*.json')]"

      - name: Python tests (pytest)
        run: pytest

      - name: cc-run tests (bash)
        run: bash tests/test_cc_run.sh
